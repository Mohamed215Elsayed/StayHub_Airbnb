services:
  mongodb:
    image: mongo:8.3
    container_name: Stayhub_MongoDB
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: mailpit
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  mongodb_data:
