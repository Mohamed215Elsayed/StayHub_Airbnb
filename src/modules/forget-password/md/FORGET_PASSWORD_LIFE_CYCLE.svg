<svg width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
        </marker>
        <style>
            .title { font: 700 34px Arial, sans-serif; fill: #111827; }
            .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
            .section-title { font: 700 22px Arial, sans-serif; fill: #111827; }
            .label { font: 700 15px Arial, sans-serif; fill: #374151; }
            .body { font: 400 15px Arial, sans-serif; fill: #374151; }
            .small { font: 400 13px Arial, sans-serif; fill: #4b5563; }
            .code { font: 400 13px "Courier New", monospace; fill: #1f2937; }
            .endpoint { font: 700 14px "Courier New", monospace; fill: #1d4ed8; }
            .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; }
            .screen { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; rx: 22; }
            .input { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
            .button { fill: #2563eb; rx: 10; }
            .button-text { font: 700 14px Arial, sans-serif; fill: #ffffff; }
            .note { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; rx: 14; }
            .error { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 14; }
            .success { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; rx: 14; }
            .arrow { stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
            .muted-line { stroke: #cbd5e1; stroke-width: 2; }
        </style>
    </defs>

    <rect width="1440" height="1120" fill="#f3f4f6" />

    <text x="72" y="72" class="title">Forget Password UX Cycle Wireframe</text>
    <text x="72" y="104" class="subtitle">Use this diagram to explain how the student moves through the UI and how each screen calls one backend endpoint.</text>

    <rect x="72" y="140" width="1296" height="90" class="note" />
    <text x="96" y="172" class="section-title">User Goal</text>
    <text x="96" y="202" class="body">The user forgot their password, receives a verification code by email, verifies the code, then creates a new password.</text>

    <!-- Screen 1 -->
    <rect x="72" y="280" width="350" height="430" class="screen" />
    <text x="104" y="324" class="section-title">1. Forgot Password</text>
    <text x="104" y="352" class="small">User enters the account email.</text>

    <text x="104" y="402" class="label">Email</text>
    <rect x="104" y="416" width="286" height="48" class="input" />
    <text x="124" y="446" class="small">student@example.com</text>

    <rect x="104" y="498" width="286" height="50" class="button" />
    <text x="201" y="529" class="button-text">Send Code</text>

    <line x1="104" y1="590" x2="390" y2="590" class="muted-line" />
    <text x="104" y="624" class="endpoint">POST /forget-password/send</text>
    <text x="104" y="654" class="body">Input: { email }</text>
    <text x="104" y="682" class="body">Output: code sent message</text>

    <!-- Backend 1 -->
    <rect x="472" y="280" width="300" height="430" class="box" />
    <text x="500" y="324" class="section-title">Send OTP Action</text>
    <text x="500" y="360" class="body">1. Find user by email.</text>
    <text x="500" y="390" class="body">2. Generate 6 digit code.</text>
    <text x="500" y="420" class="body">3. Save code in database.</text>
    <text x="500" y="450" class="body">4. Set expire date to 1 minute.</text>
    <text x="500" y="480" class="body">5. Mark verified as false.</text>
    <text x="500" y="510" class="body">6. Send code by email.</text>

    <rect x="500" y="568" width="244" height="90" class="success" />
    <text x="524" y="598" class="label">Database Record</text>
    <text x="524" y="626" class="code">{ email, code, expireDate,</text>
    <text x="524" y="650" class="code">  verified: false }</text>

    <!-- Mailpit -->
    <rect x="472" y="760" width="300" height="120" class="note" />
    <text x="500" y="802" class="section-title">Mailpit Inbox</text>
    <text x="500" y="834" class="body">Open: http://localhost:8025</text>
    <text x="500" y="862" class="body">Email subject: Forget Password</text>

    <!-- Screen 2 -->
    <rect x="822" y="280" width="300" height="430" class="screen" />
    <text x="850" y="324" class="section-title">2. Verify Code</text>
    <text x="850" y="352" class="small">User copies the email code.</text>

    <text x="850" y="402" class="label">Email</text>
    <rect x="850" y="416" width="244" height="46" class="input" />
    <text x="868" y="445" class="small">student@example.com</text>

    <text x="850" y="494" class="label">Code</text>
    <rect x="850" y="508" width="244" height="46" class="input" />
    <text x="868" y="537" class="small">123456</text>

    <rect x="850" y="586" width="244" height="50" class="button" />
    <text x="934" y="617" class="button-text">Verify</text>

    <text x="850" y="674" class="endpoint">POST /forget-password/verify</text>
    <text x="850" y="702" class="body">Input: { email, code }</text>

    <!-- Backend 2 -->
    <rect x="1172" y="280" width="196" height="430" class="box" />
    <text x="1194" y="324" class="section-title">Verify Action</text>
    <text x="1194" y="360" class="body">1. Find OTP.</text>
    <text x="1194" y="390" class="body">2. Reject if</text>
    <text x="1214" y="418" class="body">already verified.</text>
    <text x="1194" y="448" class="body">3. Reject if</text>
    <text x="1214" y="476" class="body">expired.</text>
    <text x="1194" y="506" class="body">4. Compare code.</text>
    <text x="1194" y="536" class="body">5. Set</text>
    <text x="1214" y="564" class="code">verified: true</text>
    <rect x="1194" y="612" width="148" height="54" class="success" />
    <text x="1214" y="645" class="label">Code verified</text>

    <!-- Screen 3 -->
    <rect x="822" y="740" width="300" height="300" class="screen" />
    <text x="850" y="782" class="section-title">3. Reset Password</text>
    <text x="850" y="810" class="small">User creates a new password.</text>

    <text x="850" y="852" class="label">Email</text>
    <rect x="850" y="866" width="244" height="42" class="input" />
    <text x="868" y="892" class="small">student@example.com</text>

    <text x="850" y="934" class="label">New Password</text>
    <rect x="850" y="948" width="244" height="42" class="input" />
    <text x="868" y="974" class="small">new-password-123</text>

    <rect x="850" y="1012" width="244" height="48" class="button" />
    <text x="925" y="1042" class="button-text">Reset Password</text>

    <text x="850" y="1090" class="endpoint">POST /forget-password/reset</text>

    <rect x="1172" y="740" width="196" height="300" class="box" />
    <text x="1194" y="782" class="section-title">Reset Action</text>
    <text x="1194" y="818" class="body">1. Find OTP.</text>
    <text x="1194" y="848" class="body">2. Must be</text>
    <text x="1214" y="876" class="code">verified: true</text>
    <text x="1194" y="906" class="body">3. Hash new</text>
    <text x="1214" y="934" class="body">password.</text>
    <text x="1194" y="964" class="body">4. Update user.</text>
    <text x="1194" y="994" class="body">5. Delete OTP.</text>

    <!-- Error lane -->
    <rect x="72" y="760" width="350" height="150" class="error" />
    <text x="104" y="802" class="section-title">Error Cases To Explain</text>
    <text x="104" y="834" class="body">- Email does not belong to any user.</text>
    <text x="104" y="862" class="body">- Code is wrong or expired.</text>
    <text x="104" y="890" class="body">- Reset before code verification.</text>

    <!-- Arrows -->
    <line x1="422" y1="495" x2="468" y2="495" class="arrow" />
    <line x1="772" y1="495" x2="818" y2="495" class="arrow" />
    <line x1="1122" y1="495" x2="1168" y2="495" class="arrow" />
    <line x1="622" y1="710" x2="622" y2="754" class="arrow" />
    <path d="M772 820 C800 820 800 820 818 820" class="arrow" />
    <line x1="1122" y1="890" x2="1168" y2="890" class="arrow" />

    <!-- Footer -->
    <text x="72" y="1090" class="small">Teaching order: start from the user screen, then show the endpoint, then explain the use case action behind that endpoint.</text>
</svg>